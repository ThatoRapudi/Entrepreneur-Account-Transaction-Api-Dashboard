# Serves the built React SPA. try_files falls back to index.html for
# any path that isn't a real static file, so client-side routes like
# /transactions or /loans (react-router-dom) work on a hard refresh or
# direct link instead of 404ing - nginx has no idea those routes exist
# server-side, only the React app does once it loads.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite (e.g. index-abc123.js),
    # so they're safe to cache aggressively - a new build gets new
    # filenames, it never serves stale JS/CSS under an old name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
